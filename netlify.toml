# Netlify auto-detects Next.js and uses its runtime; no plugin entry needed.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # These values are public by design (they appear in the page's video/canonical URLs), so exclude them from secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "R2_PUBLIC_URL,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_VIDEO_BASE"

# Portfolio media (filenames aren't content-hashed, so revalidate weekly rather than "immutable")
[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
